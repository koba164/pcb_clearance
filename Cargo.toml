[package]
name = "pcb-clearance"
version = "0.2.3"
edition = "2024"
description = "Altium / KiCad ガーバーの絶縁ギャップ検査"
default-run = "pcb-clearance"

[lib]
name = "pcb_clearance"

[[bin]]
name = "pcb-clearance"
path = "src/main.rs"

[[bin]]
name = "pcb-clearance-gui"
path = "src/bin/gui.rs"
required-features = ["gui"]

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:rfd", "dep:open"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
csv = "1"
geo = { version = "0.32", default-features = false }
clipper2-rust = "1.2"
glob = "0.3"
regex = "1"
rayon = "1"
rstar = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tiny-skia = "0.11"
fontdue = "0.9"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
eframe = { version = "0.33", optional = true, default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
rfd = { version = "0.15", optional = true }
open = { version = "5", optional = true }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
