[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "pcb-clearance"
version = "0.1.0"
description = "Altium / KiCad Gerber clearance checker with coordinates and PNG reports"
requires-python = ">=3.11"
dependencies = ["shapely>=2.1,<3", "numpy>=2,<3", "Pillow>=10,<12"]

[project.scripts]
pcb-clearance = "pcb_clearance.cli:main"

[tool.setuptools.packages.find]
include = ["pcb_clearance*"]
